<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Panel</title>
<style>
:root{--bg:#f4f7f6;--card:#fff;--tx:#15302b;--mut:#5f7a74;--pri:#0f766e;--pt:#fff;--bd:#d9e4e1;--soft:#e3f2ef;--dng:#b42318}
@media(prefers-color-scheme:dark){:root{--bg:#0e1a18;--card:#16262a;--tx:#e6f2ef;--mut:#93b0aa;--pri:#2dd4bf;--pt:#06211d;--bd:#26403f;--soft:#1b3433;--dng:#f97066}}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;padding:12px 18px;background:var(--card);border-bottom:1px solid var(--bd)}
.top h1{margin:0;font-size:1.2rem}nav{display:flex;gap:6px;flex-wrap:wrap}
main{max-width:1150px;margin:auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
h3{margin:0 0 10px;font-size:1rem}.mut{color:var(--mut);font-size:.85rem}
button,.fl{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:8px 14px;background:var(--soft);color:var(--tx);display:inline-block}
button.on,.pri{background:var(--pri);color:var(--pt);font-weight:600}
.del{background:transparent;color:var(--dng);border:1px solid var(--dng);padding:5px 10px}
input,select,textarea{width:100%;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
input[type=color]{padding:2px;height:38px}input[type=checkbox]{width:auto}
label{display:block;font-size:.8rem;color:var(--mut)}label input,label select{margin-top:3px;color:var(--tx)}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;align-items:end}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:12px}
.k{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}.k b{font-size:1.6rem;display:block}.k span{color:var(--mut);font-size:.8rem}
.bar{display:flex;align-items:center;gap:8px;font-size:.85rem;margin:6px 0}.bar>span:first-child{width:38%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .t{flex:1;background:var(--soft);border-radius:5px}.bar i{display:block;height:10px;background:var(--pri);border-radius:5px;min-width:3px}
.wrap{overflow-x:auto;max-height:560px}table{width:100%;border-collapse:collapse;font-size:.85rem}
th,td{padding:7px 8px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}th{color:var(--mut);position:sticky;top:0;background:var(--card)}
.rt{text-align:right;white-space:nowrap}
.li{display:flex;gap:6px;margin-bottom:6px}.ck{display:inline-block;margin:0 12px 6px 0;color:var(--tx);font-size:.9rem}
.logo{display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap}.logo img{height:48px;border-radius:8px;border:1px solid var(--bd)}
.lg{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}.lg .card{max-width:340px;width:100%}
.err{color:var(--dng);font-size:.85rem;min-height:1.2em;margin-top:6px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--pri);color:var(--pt);padding:10px 18px;border-radius:10px;display:none;z-index:9}
@media print{.np{display:none!important}body{background:#fff;color:#000}.wrap{max-height:none}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="config.js"></script>
</head>
<body>
<div id="login" class="lg"><div class="card"><h3 id="lt">Admin Login</h3><input id="em" type="email" placeholder="Email" autocomplete="username" style="margin-bottom:8px" hidden><input id="pw" type="password" placeholder="Password" autocomplete="current-password"><input id="pw2" type="password" placeholder="Confirm password" autocomplete="new-password" style="margin-top:8px" hidden><button class="pri" id="go" style="width:100%;margin-top:10px">Login</button><div class="err" id="le"></div></div></div>
<div id="app" hidden>
<div class="top np"><h1 id="ttl">Admin Panel</h1><nav><button data-t="rep" class="on">Reports &amp; Appointments</button><button data-t="sal">Sales</button><button data-t="set">Settings</button><button id="out">Logout</button></nav></div>
<main>
<section id="rep">
<div class="card np"><div class="row">
<label>From<input type="date" id="ff"></label><label>To<input type="date" id="fto"></label>
<label>Service<select id="fs"></select></label><label>Status<select id="ft"></select></label>
<label>Search<input id="fq" placeholder="Name, phone or reason"></label></div>
<div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap"><button id="csv" class="pri">Export CSV</button><button id="prt">Print report</button><button id="clr">Clear filters</button><button id="xls" class="pri">⬇ Export Excel (.xlsx)</button></div></div>
<div class="cards" id="cards"></div>
<div class="g2" id="bars"></div>
<div class="card"><h3>Appointment details</h3><div class="wrap"><table><thead><tr><th>#</th><th>Date</th><th>Time</th><th>Patient</th><th>Phone</th><th>Service</th><th>Reason</th><th>Status</th><th>Booked on</th><th class="np"></th></tr></thead><tbody id="tb"></tbody></table></div></div>
</section>
<section id="sal" hidden>
<div class="card np"><div class="row"><label>From<input type="date" id="sf"></label><label>To<input type="date" id="st"></label><label>Item<select id="si"></select></label><label>Patient<input id="sq" placeholder="Name or phone"></label></div>
<div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap"><button id="sxl" class="pri">⬇ Export Excel</button><button id="sprt">Print report</button><button id="sclr">Clear filters</button><span class="mut" id="smsg" style="align-self:center"></span></div></div>
<div class="cards" id="scards"></div><div class="g2" id="sbars"></div>
<div class="card"><h3>Upcoming follow-ups</h3><div id="sfu"></div></div>
<div class="card"><h3>Bills</h3><div class="wrap"><table><thead><tr><th>Invoice</th><th>Date</th><th>Patient</th><th>Phone</th><th>Service</th><th>Items</th><th>Total</th><th>Next visit</th><th class="np"></th></tr></thead><tbody id="sb"></tbody></table></div></div>
</section>
<section id="set" hidden></section>
</main></div>
<div id="toast"></div>

<script>
var KA="clinic_appts_v1",KC="clinic_config_v1",DN=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
var DEF={clinic:"Wellness Therapy Clinic",tagline:"Appointment booking & calendar",emoji:"🌿",logo:"",color:"#0f766e",
L:{formTitle:"New Appointment",editTitle:"Edit Appointment",book:"Book Appointment",update:"Update Appointment",name:"Full Name",phone:"Mobile / WhatsApp Number",svc:"Therapy Service",date:"Date",time:"Time",reason:"Reason for Appointment",allTitle:"All Appointments"},
P:{name:"Patient’s full name",phone:"e.g. 0300 1234567",reason:"Briefly describe the reason for the visit"},
services:["Physiotherapy","Speech Therapy","Occupational Therapy","Psychological Counseling","Behavioral Therapy"],
statuses:["Scheduled","Completed","Cancelled","No-show"],start:"10:00",end:"18:00",step:30,closed:[],
wa:"Dear {name},\n\nYour appointment at {clinic} has been confirmed.\n\nService: {service}\nDate: {date}\nTime: {time}\nReason: {reason}\n\nPlease arrive 10 minutes before your scheduled time. If you need to reschedule, kindly contact us in advance.\n\nThank you,\n{clinic}",patch:"Patches",cur:"Rs",items:[{n:"Consultation",p:1500},{n:"Therapy Session",p:2500},{n:"Follow-up Visit",p:1000},{n:"Medicine / Supplies",p:500}],waf:"Dear {name},\n\nThis is a friendly reminder of your next visit at {clinic} on {date}.\n\nService: {service}\n\nIf you need to reschedule, please contact us in advance.\n\nThank you,\n{clinic}"};
var LN={formTitle:"Form heading (new)",editTitle:"Form heading (edit)",book:"Book button",update:"Update button",name:"Name field label",phone:"Phone field label",svc:"Service field label",date:"Date field label",time:"Time field label",reason:"Reason field label",allTitle:"All-appointments heading"};
var PN={name:"Name placeholder",phone:"Phone placeholder",reason:"Reason placeholder"};
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function pad(n){return String(n).padStart(2,"0")}
function t12(t){var h=+t.slice(0,2);return (h%12||12)+":"+t.slice(3)+" "+(h<12?"AM":"PM")}
function toM(t){var p=t.split(":");return +p[0]*60+ +p[1]}
function jget(k,f){try{var r=localStorage.getItem(k);return r?JSON.parse(r):f}catch(e){return f}}
function jset(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}
function cfg(){var c=jget(KC,{}),d=JSON.parse(JSON.stringify(DEF));for(var k in c){if(k=="L"||k=="P")Object.assign(d[k],c[k]);else d[k]=c[k]}return d}
function sha256(ascii){
 function rr(v,a){return (v>>>a)|(v<<(32-a))}
 var mp=Math.pow,mw=mp(2,32),i,j,result="",words=[],al=ascii.length*8,hash=[],k=[],pc=0,ic={};
 for(var c=2;pc<64;c++){if(!ic[c]){for(i=0;i<313;i+=c)ic[i]=c;hash[pc]=(mp(c,.5)*mw)|0;k[pc++]=(mp(c,1/3)*mw)|0}}
 ascii+="\x80";while(ascii.length%64-56)ascii+="\x00";
 for(i=0;i<ascii.length;i++){j=ascii.charCodeAt(i);words[i>>2]|=j<<((3-i)%4)*8}
 words[words.length]=((al/mw)|0);words[words.length]=al;
 for(j=0;j<words.length;){var w=words.slice(j,j+=16),oh=hash;hash=hash.slice(0,8);
  for(i=0;i<64;i++){var w15=w[i-15],w2=w[i-2],a=hash[0],e=hash[4],t1=hash[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&hash[5])^(~e&hash[6]))+k[i]+(w[i]=(i<16)?w[i]:(w[i-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+w[i-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10)))|0),t2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
   hash=[(t1+t2)|0].concat(hash);hash[4]=(hash[4]+t1)|0}
  for(i=0;i<8;i++)hash[i]=(hash[i]+oh[i])|0}
 for(i=0;i<8;i++)for(j=3;j+1;j--){var b=(hash[i]>>(j*8))&255;result+=((b<16)?0:"")+b.toString(16)}
 return result}
function hp(s){return sha256(unescape(encodeURIComponent(s)))}
function rnd(){var a=new Uint32Array(4);try{crypto.getRandomValues(a)}catch(e){}return Array.from(a).map(function(n){return n.toString(36)}).join("")+Math.random().toString(36).slice(2)}
function hasPw(){return !!(C.ph&&C.ps)}
function setPw(c,pw){c.ps=rnd();c.ph=hp(c.ps+pw);delete c.pass}
var C=cfg(),D=cfg(),tab="rep";
(function(){var c=jget(KC,null);if(c&&c.pass&&!c.ph){setPw(c,c.pass);jset(KC,c);C=cfg();D=cfg()}})();

function toast(m){var t=$("toast");t.textContent=m;t.style.display="block";setTimeout(function(){t.style.display="none"},2400)}
function dl(n,t,s){var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([s],{type:t}));a.download=n;a.click()}

/* database (Supabase) */
var SB=window.SB_CONFIG||{},SK="sb_session";
function dbOn(){return !!(SB.url&&SB.key)}
function sess(){try{return JSON.parse(localStorage.getItem(SK))}catch(e){return null}}
function setSess(s){try{if(s)localStorage.setItem(SK,JSON.stringify(s));else localStorage.removeItem(SK)}catch(e){}}
function jwt(t){try{return JSON.parse(atob(t.split(".")[1].replace(/-/g,"+").replace(/_/g,"/")))}catch(e){return{}}}
function mkSess(j){var p=jwt(j.access_token);return{at:j.access_token,rt:j.refresh_token,exp:(p.exp||0)*1000,email:p.email||"",role:(p.app_metadata||{}).role||""}}
function dbAuth(grant,body){return fetch(SB.url+"/auth/v1/token?grant_type="+grant,{method:"POST",headers:{apikey:SB.key,"Content-Type":"application/json"},body:JSON.stringify(body)}).then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error_description||j.msg||"Sign-in failed");return j})})}
function dbLogin(email,pw){return dbAuth("password",{email:email,password:pw}).then(function(j){var s=mkSess(j);if(["admin","staff"].indexOf(s.role)<0)throw new Error("This account has no access. Ask the admin to assign it a role.");setSess(s);return s})}
function dbToken(){var s=sess();if(!s)return Promise.reject(new Error("Please sign in."));if(Date.now()<s.exp-60000)return Promise.resolve(s.at);return dbAuth("refresh_token",{refresh_token:s.rt}).then(function(j){var n=mkSess(j);setSess(n);return n.at},function(){setSess(null);throw new Error("Session expired. Please sign in again.")})}
function dbReq(method,path,body,extra){return dbToken().then(function(t){var h={apikey:SB.key,Authorization:"Bearer "+t,"Content-Type":"application/json"};for(var k in extra||{})h[k]=extra[k];return fetch(SB.url+"/rest/v1/"+path,{method:method,headers:h,body:body?JSON.stringify(body):undefined})}).then(function(r){
 if(r.ok)return r.text().then(function(x){return x?JSON.parse(x):[]});
 return r.json().catch(function(){return{}}).then(function(j){var e=new Error(j.message||("Database error "+r.status));e.code=j.code;e.status=r.status;throw e})})}
function dbPull(){var all=[];function pg(i){return dbReq("GET","appointments?select=*&order=date.asc,time.asc",null,{Range:i+"-"+(i+999),"Range-Unit":"items"}).then(function(rows){all=all.concat(rows);return rows.length==1000?pg(i+1000):all})}return pg(0)}
function dbRow(a){return{id:Number(a.id),date:a.date,time:a.time,name:a.name,phone:String(a.phone||""),svc:a.svc,reason:a.reason,status:a.status||"Scheduled",created:a.created||new Date().toISOString(),updated:new Date().toISOString()}}
function dbSave(items){return dbReq("POST","appointments?on_conflict=id",items.map(dbRow),{Prefer:"resolution=merge-duplicates,return=minimal"})}
function dbDel(id){return dbReq("DELETE","appointments?id=eq."+encodeURIComponent(id))}
function dbClear(){return dbReq("DELETE","appointments?id=gt.0")}
function fm(n){return (C.cur||"")+" "+(Math.round((+n||0)*100)/100).toLocaleString()}
function calc(items){var sub=0;items.forEach(function(x){sub+=x.p*x.q});sub=Math.round(sub*100)/100;return{sub:sub,total:sub}}
function dbPullT(t,ord){var all=[];function pg(i){return dbReq("GET",t+"?select=*&order="+ord,null,{Range:i+"-"+(i+999),"Range-Unit":"items"}).then(function(r){all=all.concat(r);return r.length==1000?pg(i+1000):all})}return pg(0)}
function billSave(b){return dbReq("POST","bills?on_conflict=id",[b],{Prefer:"resolution=merge-duplicates,return=minimal"})}
function billDel(id){return dbReq("DELETE","bills?id=eq."+encodeURIComponent(id))}
function printBill(b){var w=window.open("","_blank");if(!w)return false;
 var r=b.items.map(function(x,i){return "<tr><td>"+(i+1)+"</td><td>"+esc(x.n)+"</td><td class=r>"+fm(x.p)+"</td><td class=r>"+x.q+"</td><td class=r>"+fm(x.p*x.q)+"</td></tr>"}).join("");
 w.document.write("<!doctype html><html><head><meta charset=utf-8><title>Invoice</title><style>body{font-family:Arial,sans-serif;max-width:720px;margin:24px auto;color:#111;padding:0 16px}table{width:100%;border-collapse:collapse;margin-top:14px}th,td{border-bottom:1px solid #ccc;padding:8px;text-align:left}.r{text-align:right}.t td{border:0;padding:4px 8px}h1{margin:0 0 4px}.m{color:#555}</style></head><body>"
 +(C.logo?"<img src=\""+esc(C.logo)+"\" style=\"height:52px\"><br>":"")+"<h1>"+esc(C.clinic)+"</h1><div class=m>Invoice INV-"+String(b.id).slice(-8)+" · "+esc(b.bill_date)+"</div><hr>"
 +"<p><b>"+esc(b.name)+"</b><br>"+esc(b.phone)+"<br>"+esc(b.svc)+"</p>"
 +"<table><tr><th>Sr No</th><th>Item</th><th class=r>Price</th><th class=r>Qty</th><th class=r>Total</th></tr>"+r+"</table>"
 +"<table class=t>"+(b.discount?"<tr><td class=r>Subtotal</td><td class=r>"+fm(b.subtotal)+"</td></tr><tr><td class=r>Discount"+(b.disc_type=="pct"?" ("+b.disc_value+"%)":"")+"</td><td class=r>- "+fm(b.discount)+"</td></tr>":"")+"<tr><td class=r><b>Total</b></td><td class=r><b>"+fm(b.total)+"</b></td></tr></table>"
 +(b.next_visit?"<p><b>Next visit:</b> "+esc(b.next_visit)+"</p>":"")+"</body></html>");
 w.document.close();w.focus();setTimeout(function(){w.print()},300);return true}
function dbCfgGet(){return dbReq("GET","settings?id=eq.1&select=data").then(function(r){return r[0]?r[0].data:null})}
function dbCfgSet(d){return dbReq("POST","settings?on_conflict=id",[{id:1,data:d}],{Prefer:"resolution=merge-duplicates,return=minimal"})}
function refresh(){rep();fillFilters()}
function pullA(){pullBills();return dbPull().then(function(rows){if(!rows.length&&jget(KA,[]).length){toast("The database is empty. Use “Upload local data to database” in Settings → Data.");return}jset(KA,rows);refresh()}).catch(function(e){toast("Database: "+e.message)})}
function cfgFromDb(){return dbCfgGet().then(function(d){if(!d)return;var old=jget(KC,{}),n=Object.assign({},d);if(old.ps){n.ps=old.ps;n.ph=old.ph}jset(KC,n);try{localStorage.setItem("clinic_cfg_db",JSON.stringify(d))}catch(e){}C=cfg();D=cfg();$("ttl").textContent=C.clinic+" – Admin";fillFilters();setUI();rep()}).catch(function(){})}
function dbBoot(){if(!dbOn())return;cfgFromDb();pullA();setInterval(function(){if(tab=="rep"&&!document.hidden)pullA()},30000)}
/* sales */
var KB="clinic_bills_v1";
function salMsg(t){var e=$("smsg");if(e)e.textContent=t}
function pullBills(){if(!dbOn())return;dbPullT("bills","created.desc").then(function(b){jset(KB,b);salMsg("");if(tab=="sal")sal()},function(e){salMsg("Bills could not be loaded: "+e.message+" (run supabase-setup.sql again in Supabase).")})}
function billCard(){return '<div class="card"><h3>Billing &amp; invoice</h3><div class="row">'+fld("Currency symbol","cur",0,D.cur)+fld("Button label (shown next to Cancel)","patch",0,D.patch)+'</div><h3 style="margin-top:14px">Items &amp; prices</h3>'+D.items.map(function(x,i){return '<div class="li"><input data-it="n" data-i="'+i+'" value="'+esc(x.n)+'" placeholder="Item name"><input data-it="p" data-i="'+i+'" type="number" min="0" step="any" value="'+esc(x.p)+'" placeholder="Price" style="max-width:130px"><button class="del" data-rmit="'+i+'">✕</button></div>'}).join("")+'<button data-addit="1">+ Add item</button></div>'}
function billsF(){var f=$("sf").value,t=$("st").value,it=$("si").value,q=$("sq").value.toLowerCase();
 return jget(KB,[]).filter(function(b){return (!f||b.bill_date>=f)&&(!t||b.bill_date<=t)&&(!it||b.items.some(function(x){return x.n==it}))&&(!q||(b.name+" "+b.phone).toLowerCase().indexOf(q)>-1)}).sort(function(a,b){return a.created<b.created?1:-1})}
function sumg(A,kf,vf){var m={};A.forEach(function(a){var k=kf(a);m[k]=(m[k]||0)+vf(a)});return m}
function topN(m,n){var o={};Object.keys(m).sort(function(a,b){return m[b]-m[a]}).slice(0,n).forEach(function(k){o[k]=m[k]});return o}
function allItems(){var s=C.items.map(function(x){return x.n});jget(KB,[]).forEach(function(b){b.items.forEach(function(x){if(s.indexOf(x.n)<0)s.push(x.n)})});return s}
function sal(){var B=billsF(),all=jget(KB,[]),n=new Date(),td=n.getFullYear()+"-"+pad(n.getMonth()+1)+"-"+pad(n.getDate()),mo=td.slice(0,7),R=function(x){return Math.round(x*100)/100};
 var g=0,d=0,t=0,q=0,tdS=0,moS=0;B.forEach(function(b){t+=b.total;b.items.forEach(function(x){q+=x.q})});
 all.forEach(function(b){if(b.bill_date==td)tdS+=b.total;if(b.bill_date.slice(0,7)==mo)moS+=b.total});
 var si=$("si").value;$("si").innerHTML=opts(allItems(),"All items");$("si").value=si;
 $("scards").innerHTML=kc("Bills",B.length)+kc("Total sales",fm(t))+kc("Average bill",fm(B.length?t/B.length:0))+kc("Items sold",R(q))+kc("Today’s sales",fm(tdS))+kc("This month",fm(moS));
 var im={},iq={};B.forEach(function(b){b.items.forEach(function(x){im[x.n]=(im[x.n]||0)+x.p*x.q;iq[x.n]=(iq[x.n]||0)+x.q})});
 $("sbars").innerHTML=bars("Revenue by item",im,0,0,fm)+bars("Quantity sold by item",iq)+bars("Net sales by month",sumg(B,function(b){return b.bill_date.slice(0,7)},function(b){return b.total}),1,0,fm)+bars("Net sales by service",sumg(B,function(b){return b.svc||"—"},function(b){return b.total}),0,0,fm)+bars("Top patients by spend",topN(sumg(B,function(b){return b.name+" ("+b.phone+")"},function(b){return b.total}),8),0,0,fm);
